<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HuddleFM</title>
    <meta
      name="description"
      content="A self hosted music bot for Slack huddles."
    />
    <link rel="icon" href="logo.png" />
    <style>
      @font-face {
        font-family: Lexend;
        font-weight: 100 900;
        font-display: swap;
        src: url(fonts/lexend-latin-wght-normal.woff2) format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: Lexend;
        font-weight: 100 900;
        font-display: swap;
        src: url(fonts/lexend-latin-ext-wght-normal.woff2) format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        color-scheme: light dark;
        /* Catppuccin Latte: base, text, subtext0, surface0, mantle, mauve */
        --bg: #eff1f5;
        --fg: #4c4f69;
        --muted: #6c6f85;
        --line: #ccd0da;
        --soft: #e6e9ef;
        --accent: #8839ef;
        font:
          16px/1.6 Lexend,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          /* Catppuccin Mocha */
          --bg: #1e1e2e;
          --fg: #cdd6f4;
          --muted: #a6adc8;
          --line: #313244;
          --soft: #181825;
          --accent: #cba6f7;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 3rem 1.25rem 5rem;
      }
      a {
        color: var(--accent);
        text-underline-offset: 2px;
      }
      header {
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }
      .brand img {
        width: 56px;
        height: 56px;
        image-rendering: pixelated;
      }
      h1 {
        font-size: 2.25rem;
        margin: 0;
        letter-spacing: -0.02em;
      }
      .intro {
        font-size: 1.125rem;
        margin: 1.25rem 0;
      }
      .intro p {
        margin: 0;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      nav a,
      button {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.4rem 0.85rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        text-decoration: none;
        cursor: pointer;
      }
      nav a:first-child {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
      }
      nav a:hover,
      button:hover {
        border-color: var(--muted);
      }
      .warning {
        color: var(--muted);
        font-size: 0.8125rem;
        margin-top: 1.5rem;
      }
      .warning p {
        margin: 0;
      }
      h2 {
        font-size: 1.375rem;
        margin: 3rem 0 0.75rem;
        letter-spacing: -0.01em;
      }
      h3 {
        font-size: 1.0625rem;
        margin: 2rem 0 0.5rem;
      }
      h4 {
        font-size: 0.9375rem;
        margin: 1.5rem 0 0.5rem;
      }
      ul {
        padding-left: 1.25rem;
      }
      li {
        margin: 0.25rem 0;
      }
      code {
        font:
          0.875em ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
      }
      :not(pre) > code {
        background: var(--soft);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      pre {
        background: var(--soft);
        padding: 0.9rem 1rem;
        border-radius: 8px;
        overflow-x: auto;
        line-height: 1.45;
      }
      .table {
        overflow-x: auto;
        margin: 1rem 0;
      }
      table {
        border-collapse: collapse;
        font-size: 0.875rem;
      }
      th,
      td {
        text-align: left;
        vertical-align: top;
        padding: 0.45rem 0.75rem 0.45rem 0;
        border-bottom: 1px solid var(--line);
      }
      #plugins {
        margin-top: 3rem;
        padding: 0.25rem 1.25rem 1.25rem;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      #plugins h2 {
        margin-top: 1rem;
      }
      .plugin h3 {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        margin: 1.25rem 0 0.25rem;
      }
      .plugin h3 a {
        font-size: 0.8125rem;
        font-weight: 400;
      }
      .file {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.6rem 0;
        border-top: 1px solid var(--line);
      }
      .file:first-of-type {
        border-top: 0;
      }
      .file span {
        display: block;
        color: var(--muted);
        font-size: 0.8125rem;
      }
      .file button {
        flex: none;
      }
      button.copied {
        color: var(--accent);
        border-color: var(--accent);
      }
      footer {
        margin-top: 4rem;
        color: var(--muted);
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img src="logo.png" alt="" />
          <h1>HuddleFM</h1>
        </div>
        <div class="intro">{{intro}}</div>
        <nav>
          <a href="#self-hosting">Self host it</a>
          <a href="#plugins">Client plugins</a>
          <a href="https://github.com/ingoau/huddlefm">GitHub</a>
        </nav>
        <div class="warning">{{warning}}</div>
      </header>
      {{content}}
      <footer>
        <a href="https://github.com/ingoau/huddlefm">ingoau/huddlefm</a>
      </footer>
    </main>
    <script>
      for (const button of document.querySelectorAll("[data-copy]")) {
        button.addEventListener("click", async () => {
          const url = new URL(button.dataset.copy, location.href).href;
          await navigator.clipboard.writeText(url);
          button.textContent = "Copied";
          button.classList.add("copied");
          setTimeout(() => {
            button.textContent = "Copy link";
            button.classList.remove("copied");
          }, 1500);
        });
      }
    </script>
  </body>
</html>
