name: Client plugins

# The Taut and Slick plugins, built in parallel. They share clients/core, so
# a change to it builds both.
on:
  push:
    paths:
      - "clients/**"
      - ".github/workflows/client-plugins.yml"
  pull_request:
    paths:
      - "clients/**"
      - ".github/workflows/client-plugins.yml"
  workflow_dispatch:

env:
  # The Taut and Slick commits the plugins are checked and built against.
  # Bump one to pick up changes to that mod's plugin API or bundler.
  TAUT_REF: d36f37b2929ce26106f97ce94c460de17269b6da
  SLICK_REF: 22f132927ae5dcde4a52164234aa50210780ed26

jobs:
  taut:
    name: Taut plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: jeremy46231/taut
          ref: ${{ env.TAUT_REF }}
          path: taut
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: taut/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: taut
      # Checked as one of Taut's own plugins, against its types and lint rules.
      # The plugin imports ../core, which sits beside plugins/ here as it does
      # in clients/; its tests run with the bot's.
      - run: |
          cp ../clients/taut/HuddleFM.tsx plugins/HuddleFM.tsx
          mkdir core
          cp ../clients/core/*.ts ../clients/core/*.tsx core/
          rm core/*.test.ts
          npx tsc --noEmit
          npx biome lint plugins/HuddleFM.tsx core
        working-directory: taut
      - run: |
          mkdir -p ../dist
          npm run build:user-plugin -- ../clients/taut/HuddleFM.tsx ../dist/HuddleFM.js
        working-directory: taut
      - uses: actions/upload-artifact@v7
        with:
          name: huddlefm-taut-plugin
          path: dist/HuddleFM.js
          if-no-files-found: error

  slick:
    name: Slick plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: 3kh0/slick
          ref: ${{ env.SLICK_REF }}
          path: slick
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: slick
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # A user plugin may only import its own files, so the plugin and ../core
      # go in one folder, beside each other as they are in clients/, with an
      # index.tsx for Slick to build from. There it's checked as one of
      # Slick's own plugins, against its types; its lint rules cover the
      # Slick side, as Taut's cover core. Core's tests run with the bot's.
      - run: |
          mkdir -p src/plugins/HuddleFM/slick src/plugins/HuddleFM/core
          cp ../clients/slick/HuddleFM.tsx src/plugins/HuddleFM/slick/
          cp ../clients/core/*.ts ../clients/core/*.tsx src/plugins/HuddleFM/core/
          rm src/plugins/HuddleFM/core/*.test.ts
          echo 'export { default } from "./slick/HuddleFM.tsx";' > src/plugins/HuddleFM/index.tsx
          bun run typecheck
          bun run lint src/plugins/HuddleFM/slick src/plugins/HuddleFM/index.tsx
          bun run build:plugin src/plugins/HuddleFM ../dist/HuddleFM.js
        working-directory: slick
      - uses: actions/upload-artifact@v7
        with:
          name: huddlefm-slick-plugin
          path: |
            dist/HuddleFM.js
            dist/HuddleFM.user.js
          if-no-files-found: error
